version: 0.1
cli:
  version: 1.25.0

runtimes:
  enabled:
    - java@13.0.11
    - node@22.22.3
    - python@3.10.8

lint:
  disabled:
    - dart
    - oxipng
    - svgo
  enabled:
    - ktlint@1.8.0
    - prettier@3.9.6:
        packages:
          - prettier-plugin-markdown-dart@1.1.1
    - shellcheck@0.11.0
    - shfmt@3.13.1
  ignore:
    - linters: [cspell, shellcheck, shfmt]
      paths:
        - android/gradlew
        - example/android/gradlew
    - linters: [osv-scanner]
      paths:
        - "**/Podfile.lock"
    - linters: [prettier]
      paths:
        - web/flutter_bootstrap.js

actions:
  disabled:
    - trunk-fmt-pre-commit
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-upgrade-available
