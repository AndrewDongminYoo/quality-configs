version: 0.1
cli:
  version: 1.25.0

runtimes:
  enabled:
    - java@13.0.11
    - node@22.22.3
    - python@3.14.4

lint:
  disabled:
    - oxipng
    - svgo
  enabled:
    # The project's own SDK formats, so the result matches running `dart format`
    # by hand. Analyze stays off: see docs/notes/2026-08-29-dart-linter-evaluation.md.
    - dart@SYSTEM:
        commands: [format]
    - ktlint@1.8.0
    - prettier@3.9.6:
        packages:
          - prettier-plugin-markdown-dart@1.1.1
    - shellcheck@0.11.0
    - shfmt@3.13.1
  ignore:
    - linters: [cspell, shellcheck, shfmt]
      paths:
        - android/gradlew
        - example/android/gradlew
    - linters: [osv-scanner]
      paths:
        - "**/Podfile.lock"
    - linters: [prettier]
      paths:
        - web/flutter_bootstrap.js

actions:
  disabled:
    - trunk-fmt-pre-commit
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-upgrade-available
