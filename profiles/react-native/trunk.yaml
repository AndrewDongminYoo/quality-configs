version: 0.1
cli:
  version: 1.25.0

runtimes:
  enabled:
    - java@13.0.11
    - node@22.22.3
    - python@3.10.8

lint:
  disabled:
    - dotenv-linter
    - oxipng
    - svgo
  enabled:
    - eslint@SYSTEM
    - ktlint@1.8.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
  ignore:
    - linters: [cspell, shellcheck, shfmt]
      paths:
        - android/gradlew
        - example/android/gradlew
    - linters: [dotenv-linter]
      paths:
        - ios/.xcode.env
        - ios/.xcode.env.local
    - linters: [osv-scanner]
      paths:
        - "**/Podfile.lock"

actions:
  disabled:
    - trunk-fmt-pre-commit
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-upgrade-available
